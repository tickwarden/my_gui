name: lint-datapack

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Datapack Lint (Spyglass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint with ChenCMD/datapack-linter
        uses: ChenCMD/datapack-linter@v2
        with:
          GITHUB_TOKEN: ${{ github.token }}
