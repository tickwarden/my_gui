name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Clean up directories
        run: |
          rm -rf atlas bazaar reliquary vault

      - name: Generate datapacks
        run: python generate.py

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage
        run: git add .

      - name: Commit
        run: git diff --cached --quiet || git commit -m "Auto-generated changes"

      - name: Push
        run: git push || git push --force
